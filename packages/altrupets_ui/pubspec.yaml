name: altrupets_ui
description: "Shared AltruPets UI package — Atomic Design widgets and unified theme."
version: 0.1.0
homepage:
publish_to: 'none'

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ">=6.2.1 <9.0.0"
  shared_ui_core:
    git:
      url: https://github.com/chimeranext/flutter_shared_ui
      path: packages/shared_ui_core
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/style_dictionary/tokens.json
